name: debian_amd64_packaging

on:
  release:
  schedule:
    - cron: '0 2 * * FRI'
  repository_dispatch:
    types: [backend_automation]
  workflow_dispatch:

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:focal
          - ubuntu:jammy
          - ubuntu:noble
          - debian:bullseye
          - debian:bookworm
          - debian:trixie
        platform:
          - linux/amd64
        armci_network:
          - MPI-PR
          - MPI-TS
        os:
          - ubuntu-latest
        include:
          - {platform: linux/arm64, image: debian:bookworm, armci_network: MPI-TS, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2880
 
    steps:
      - name: modify image name
        run: |
          echo "image_name=$(echo ${{ matrix.image}}| sed 's/:/_/')" >> $GITHUB_ENV
          echo "platform_name=$(echo ${{ matrix.platform}}| sed 's/\//_/g')" >> $GITHUB_ENV
      - name: set artifacts dir & name
        run: |
          echo "art_dir=nwchem-${{ env.image_name }}-${{ matrix.armci_network }}-${{ env.platform_name }}" >> $GITHUB_ENV
          echo "art_name=nwchem-${{ env.image_name }}-${{ matrix.armci_network }}-${{ env.platform_name }}.pkg" >> $GITHUB_ENV
      - name: delete artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: ${{ env.art_name}}
          failOnError: false 
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
              image=moby/buildkit:v0.18.2
              network=host
          buildkitd-flags: --debug
      - name: Qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: ${{ matrix.platform }}
      - name: build_docker
        uses: docker/build-push-action@v6
        with:
          push: false
          context: nwchem
          shm-size: 256m
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=out
          env: |
            DOCKER_BUILD_NO_SUMMARY: true
          build-args: |
            IMAGE=${{ matrix.image }}
            ARMCI_NETWORK=${{ matrix.armci_network }}
      - name: copy packages
        run: |
          find . -name "*deb" ||  true
          mkdir  -p ${{ env.art_dir }}
          cp out/nwchem-data*deb ${{ env.art_dir }}/.
          cp out/nwchem_*deb ${{ env.art_dir }}/.
      - name: rename packages
        run: |
          cd ${{ env.art_dir }}
          for f in *deb; do mv $f $(echo $f|sed s/.deb/.${{env.image_name}}.deb/) ; done
          ls -lrat
      - name: upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.art_name }}
          path: ${{ env.art_dir }}
          retention-days: 7
